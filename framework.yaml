framework:
  name: ai-work-framework
  version: "0.1"
  status: draft

profiles:
  lightweight:
    required_files:
      - PROJECT.md
      - STATE.md
      - PROGRESS.md
  full:
    required_files:
      - PROJECT.md
      - RULES.md
      - STATE.md
      - TASKS.md
      - PROGRESS.md
      - DECISIONS.md
      - CHECKS.md

execution:
  require_baseline: true
  prefer_bounded_actions: true
  require_verification: true
  require_completion_state: true
  require_handoff_when_incomplete: true
  preserve_failed_checks: true

state_classes:
  - VERIFIED
  - OBSERVED
  - REPORTED
  - INFERRED
  - ASSUMED
  - STALE
  - UNKNOWN

completion_states:
  - COMPLETE
  - PARTIAL
  - BLOCKED
  - FAILED
  - CANCELLED

permissions:
  default_autonomous:
    - read
    - collect_evidence
    - analyze
    - non_destructive_query
    - create_working_artifact
    - validate
    - update_approved_project_files
  default_approval_required:
    - delete_data
    - production_change
    - production_restart
    - external_publish
    - external_communication
    - purchase
    - financial_trade
    - irreversible_action

failure_policy:
  fabricate_success: never
  silently_substitute_source: never
  weaken_failed_check: never
  record_material_failure: always
  preserve_successful_work: true

concurrency:
  blind_overwrite_canonical_state: false
  recheck_before_write: true
  prefer_append_only_history: true

review:
  independent_review_triggers:
    - production_impact
    - destructive_or_irreversible
    - financial_consequence
    - conflicting_evidence
    - low_confidence
    - novel_architecture
    - large_scope
    - security_impact
    - contractual_or_legal_consequence
    - explicitly_requested
