name: validate

on:
  push:
  pull_request:

jobs:
  project-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: python scripts/check_public_content.py
      - run: python scripts/generate_compact_instructions.py --check
